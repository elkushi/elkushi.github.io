# Builds the site from content/*.html, checks every link and asset, and publishes it to GitHub Pages.
# Edit a file in content/, push to main, and the site updates in about a minute.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages from content/
        run: python3 tools/build.py
      - name: Check links, assets and CSP
        run: python3 tools/check.py
      - name: Collect the public files
        run: |
          mkdir -p _site
          cp -r index.html 404.html style.css reveal.js sw.js robots.txt sitemap.xml llms.txt yandex_a76192be7ccf1b10.html .nojekyll assets work blog clinics _site/
          # yandex_*.html: Yandex Webmaster ownership file (2026-11-13). Keep it, or Yandex loses the verification.
          # Every translated language lives in its own folder; copy whichever exist.
          for lang in ar ru; do
            if [ -d "$lang" ]; then cp -r "$lang" _site/; fi
          done
          # Clinic demo pages (noindex, not in the sitemap) are the target of the QR codes on the
          # printed pitches. They MUST be copied here: this list is an allowlist, so a folder that
          # is missing from it is pushed to the Pages repo and then silently dropped at deploy —
          # which is exactly how /clinics/ once returned 404 (commit 871abf3).
          if [ -d demo ]; then cp -r demo _site/; fi
          # /zapis/ is the live booking demo linked from page 1 of every emailed pitch. Same
          # allowlist trap as demo/ above: leave it out and the link in a sent PDF 404s.
          if [ -d zapis ]; then cp -r zapis _site/; fi
          echo "published:" && find _site -name '*.html' | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
