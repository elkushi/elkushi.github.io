# Builds the site from content/*.html, checks every link and asset, and publishes it to GitHub Pages.
# Edit a file in content/, push to main, and the site updates in about a minute.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages from content/
        run: python3 tools/build.py
      - name: Check links, assets and CSP
        run: python3 tools/check.py
      - name: Collect the public files
        run: |
          mkdir -p _site
          cp -r index.html style.css reveal.js sw.js robots.txt sitemap.xml .nojekyll assets work blog _site/
          # Every translated language lives in its own folder; copy whichever exist.
          for lang in ar ru; do
            if [ -d "$lang" ]; then cp -r "$lang" _site/; fi
          done
          echo "published:" && find _site -name '*.html' | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
