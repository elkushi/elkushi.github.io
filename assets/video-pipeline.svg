<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" role="img" aria-label="Video pipeline: brief, agents, schema check, voice and visuals, Remotion render, QA, then delivery.">
<style>
  .box { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; } .gate { stroke: #0969da; stroke-width: 2; }
  .t { font: 600 14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill: #1f2328; text-anchor: middle; }
  .s { font: 11px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill: #59636e; text-anchor: middle; }
  .e { stroke: #d1d9e0; stroke-width: 2; } .a { fill: #d1d9e0; }
  .loop { fill: none; stroke: #cf222e; stroke-width: 1.5; stroke-dasharray: 5 4; } .lt { font: 600 12px ui-monospace,Menlo,Consolas,monospace; fill: #cf222e; text-anchor: middle; }
  .ok { font: 600 12px ui-monospace,Menlo,Consolas,monospace; fill: #1a7f37; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .box { fill: #151b23; stroke: #3d444d; } .gate { stroke: #4493f8; } .t { fill: #f0f6fc; } .s { fill: #9198a1; }
    .e { stroke: #3d444d; } .a { fill: #3d444d; } .loop { stroke: #f85149; } .lt { fill: #f85149; } .ok { fill: #3fb950; }
  }
</style>
