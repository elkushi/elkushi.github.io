<svg class="art" viewBox="0 0 560 520" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="hero-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" class="stop-a" stop-opacity=".5"/><stop offset="1" class="stop-a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8b4fe"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="hero-fade-g" cx="50%" cy="50%" r="50%">
      <stop offset=".3" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="hero-fade"><rect width="560" height="520" fill="url(#hero-fade-g)"/></mask>
    <pattern id="hero-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle class="bar" cx="2" cy="2" r="1.2"/></pattern>
    <path id="hero-star" d="M0-16c1.6 11 5 14.4 16 16-11 1.6-14.4 5-16 16-1.6-11-5-14.4-16-16 11-1.6 14.4-5 16-16z"/>
  </defs>

  <!-- Light behind the scene, a dot grid fading out, and a slow orbit. -->
  <circle cx="290" cy="270" r="270" fill="url(#hero-glow)"/>
  <rect width="560" height="520" fill="url(#hero-dots)" mask="url(#hero-fade)"/>
  <g class="orbit">
    <circle class="ac-s thin" cx="290" cy="270" r="238" stroke-dasharray="2 12" opacity=".45"/>
    <circle class="ac" cx="52" cy="270" r="4"/>
    <circle class="warm" cx="528" cy="270" r="3"/>
    <circle class="ok" cx="290" cy="508" r="3"/>
  </g>

  <!-- Wires: the model feeds the chart, the checks feed the hours saved. -->
  <path class="ln" d="M166 104c80-34 150-34 222-10M430 384c14 0 20 10 20 22"/>
  <path class="ac-s drift" d="M166 104c80-34 150-34 222-10M430 384c14 0 20 10 20 22" stroke-dasharray="3 9"/>

  <!-- The product: a chat window. -->
  <g class="glow">
    <rect class="p2" x="120" y="130" width="330" height="284" rx="22"/>
  </g>
  <path class="ln-s" d="M120 174h330"/>
  <circle class="bad" cx="146" cy="152" r="4.5"/>
  <circle class="warm" cx="162" cy="152" r="4.5"/>
  <circle class="ok" cx="178" cy="152" r="4.5"/>

  <!-- The question. -->
  <rect class="ac-soft" x="264" y="190" width="166" height="40" rx="14"/>
  <rect class="bar-i" x="280" y="202" width="118" height="6" rx="3"/>
  <rect class="bar-i" x="280" y="214" width="78" height="6" rx="3" opacity=".5"/>

  <!-- The answer. -->
  <circle cx="158" cy="262" r="16" fill="url(#hero-core)"/>
  <use href="#hero-star" transform="translate(158 262) scale(.5)" fill="#fff"/>
  <rect class="p" x="184" y="242" width="246" height="68" rx="14"/>
  <rect class="bar" x="200" y="257" width="204" height="6" rx="3"/>
  <rect class="bar" x="200" y="271" width="172" height="6" rx="3"/>
  <rect class="bar" x="200" y="285" width="118" height="6" rx="3"/>

  <!-- The checks it has to pass before anyone sees it. -->
  <rect class="bg ln-s" x="140" y="326" width="290" height="74" rx="14"/>
  <circle class="ok" cx="162" cy="344" r="7"/><path d="M158.5 344l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="bar-i" x="178" y="341.5" width="120" height="5" rx="2.5"/>
  <circle class="ok" cx="162" cy="363" r="7"/><path d="M158.5 363l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="bar-i" x="178" y="360.5" width="92" height="5" rx="2.5"/>
  <g class="pulse slow">
    <circle class="ok" cx="162" cy="382" r="7"/><path d="M158.5 382l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect class="bar-i" x="178" y="379.5" width="138" height="5" rx="2.5"/>
  <path class="ac-s" d="M392 342l16 7v11c0 10-7 18-16 21-9-3-16-11-16-21v-11z"/>
  <path class="ok-s" d="M385 361l5 5 9.5-10"/>

  <!-- A wrong answer, caught and held back. -->
  <path class="bad-s" d="M430 276c14 0 20-6 32-6" stroke-dasharray="3 6"/>
  <g class="float d1">
    <rect class="bad-soft" x="462" y="254" width="74" height="32" rx="16"/>
    <path class="bad-s" d="M475 265l10 10M485 265l-10 10"/>
    <rect class="bad" x="494" y="267.5" width="30" height="5" rx="2.5" opacity=".6"/>
  </g>

  <!-- The model at the centre of it. -->
  <circle class="ac-s thin spin" cx="128" cy="116" r="50" stroke-dasharray="4 8" opacity=".7"/>
  <g class="glow">
    <circle cx="128" cy="116" r="36" fill="url(#hero-core)"/>
  </g>
  <use href="#hero-star" transform="translate(128 116) scale(1.05)" fill="#fff"/>
  <g transform="translate(150 94) scale(.38)"><use class="spin" href="#hero-star" fill="#fff"/></g>

  <!-- What it feeds: leads going up. -->
  <g class="float">
    <rect class="p" x="388" y="56" width="150" height="104" rx="16"/>
    <rect class="bar-i" x="404" y="72" width="52" height="6" rx="3"/>
    <path class="ln-s" d="M404 144h118"/>
    <rect class="ac-soft" x="408" y="128" width="12" height="16" rx="3"/>
    <rect class="ac-soft" x="426" y="122" width="12" height="22" rx="3"/>
    <rect class="ac-soft" x="444" y="125" width="12" height="19" rx="3"/>
    <rect class="ac" x="462" y="112" width="12" height="32" rx="3" opacity=".75"/>
    <rect class="ac" x="480" y="104" width="12" height="40" rx="3" opacity=".85"/>
    <rect class="ac" x="498" y="92" width="12" height="52" rx="3"/>
    <path class="warm-s" d="M414 116l18-8 18 4 18-14 18-8 18-12"/>
    <path class="warm-s" d="M496 76l8-2-1 8"/>
  </g>

  <!-- What it saves: hours. -->
  <g class="float d2">
    <rect class="p" x="420" y="406" width="124" height="80" rx="16"/>
    <circle class="ink-s" cx="452" cy="446" r="17"/>
    <path class="ink-s" d="M452 446v-10"/>
    <path class="ac-s tick" d="M452 446h11" style="transform-origin: 452px 446px"/>
    <circle class="ac" cx="452" cy="446" r="2.5"/>
    <rect class="bar-i" x="478" y="434" width="50" height="6" rx="3"/>
    <rect class="ok" x="478" y="448" width="36" height="6" rx="3"/>
  </g>

  <!-- The structure it answers in. -->
  <g class="float d1">
    <rect class="p" x="24" y="196" width="112" height="96" rx="16"/>
    <path class="ac-s" d="M48 214c-6 0-8 3-8 8v10c0 4-2 6-6 6 4 0 6 2 6 6v10c0 5 2 8 8 8M112 214c6 0 8 3 8 8v10c0 4 2 6 6 6-4 0-6 2-6 6v10c0 5-2 8-8 8"/>
    <rect class="warm" x="56" y="222" width="44" height="5" rx="2.5"/>
    <rect class="bar" x="56" y="234" width="34" height="5" rx="2.5"/>
    <rect class="bar-i" x="56" y="246" width="48" height="5" rx="2.5"/>
    <rect class="bar" x="56" y="258" width="28" height="5" rx="2.5"/>
  </g>

  <!-- How it runs: a pipeline, step by step. -->
  <g class="float d2">
    <rect class="p" x="40" y="430" width="176" height="64" rx="16"/>
    <path class="ln" d="M80 462h34M136 462h34"/>
    <path class="ac-s drift" d="M80 462h34M136 462h34" stroke-dasharray="3 9"/>
    <circle class="p2 ac-b" cx="68" cy="462" r="12"/>
    <path class="warm" d="M70 454l-7 10h5l-2 7 7-10h-5z"/>
    <circle cx="125" cy="462" r="12" fill="url(#hero-core)"/>
    <use href="#hero-star" transform="translate(125 462) scale(.4)" fill="#fff"/>
    <circle class="ok" cx="182" cy="462" r="12"/>
    <path d="M177 462l3.5 3.5 6.5-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparks. -->
  <use class="ac pulse" href="#hero-star" transform="translate(512 196) scale(.32)"/>
  <use class="warm pulse slow" href="#hero-star" transform="translate(262 470) scale(.28)"/>
  <use class="ac pulse slow d1" href="#hero-star" transform="translate(40 352) scale(.24)"/>
</svg>
