<svg class="art hero-back" viewBox="0 0 640 680" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="hb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hb-portal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e9d5ff" stop-opacity=".75"/><stop offset=".45" stop-color="#a855f7" stop-opacity=".45"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hb-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".05"/><stop offset=".5" stop-color="#c084fc" stop-opacity=".7"/><stop offset="1" stop-color="#a855f7" stop-opacity=".05"/>
    </linearGradient>
  </defs>

  <!-- Light behind him. -->
  <circle cx="320" cy="330" r="330" fill="url(#hb-glow)"/>

  <!-- The floor he stands on: ripples round a lit portal. -->
  <ellipse cx="320" cy="630" rx="306" ry="50" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="2 10" opacity=".35"/>
  <ellipse cx="320" cy="630" rx="250" ry="41" fill="none" stroke="#a855f7" stroke-width="1.2" opacity=".25"/>
  <ellipse cx="320" cy="630" rx="200" ry="34" fill="url(#hb-portal)"/>
  <path d="M120 630A200 34 0 0 1 520 630" fill="none" stroke="#d8b4fe" stroke-width="2.5" opacity=".55"/>

  <!-- The far half of the ring round him. -->
  <g transform="rotate(-10 320 380)">
    <path d="M20 380A300 64 0 0 1 620 380" fill="none" stroke="url(#hb-ring)" stroke-width="2"/>
  </g>

  <!-- Shapes behind him, half hidden, for depth. -->
  <g opacity=".55">
    <path d="M470 22l19 11-19 11-19-11z" fill="#c084fc"/>
    <path d="M451 33l19 11v22l-19-11z" fill="#7c3aed"/>
    <path d="M470 44l19-11v22l-19 11z" fill="#4c1d95"/>
  </g>
  <circle cx="180" cy="58" r="9" fill="#a855f7" opacity=".6"/>
</svg>
