<svg class="art hero-front" viewBox="0 0 640 680" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="hf-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".1"/><stop offset=".5" stop-color="#f5d0fe"/><stop offset="1" stop-color="#a855f7" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="hf-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e8ff"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <linearGradient id="hf-left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9333ea"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="hf-right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b21b6"/><stop offset="1" stop-color="#2e1065"/></linearGradient>
    <linearGradient id="hf-gold-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5c45e"/><stop offset="1" stop-color="#c46a1c"/></linearGradient>
    <linearGradient id="hf-gold-r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b45309"/><stop offset="1" stop-color="#6b2f0a"/></linearGradient>
    <radialGradient id="hf-sphere" cx=".36" cy=".3" r=".75">
      <stop offset="0" stop-color="#fdf4ff"/><stop offset=".35" stop-color="#c084fc"/><stop offset=".7" stop-color="#7c3aed"/><stop offset="1" stop-color="#3b0764"/>
    </radialGradient>
    <linearGradient id="hf-shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8b4fe"/><stop offset=".55" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="hf-bubble" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2142"/><stop offset="1" stop-color="#171121"/></linearGradient>
    <path id="hf-star" d="M0-16c1.6 11 5 14.4 16 16-11 1.6-14.4 5-16 16-1.6-11-5-14.4-16-16 11-1.6 14.4-5 16-16z"/>
  </defs>

  <!-- The near half of the ring and the portal, in front of him. A spark
       runs along the ring. -->
  <g transform="rotate(-10 320 380)">
    <path d="M620 380A300 64 0 0 1 20 380" fill="none" stroke="url(#hf-ring)" stroke-width="2.5"/>
    <path class="comet" d="M620 380A300 64 0 0 1 20 380" pathLength="1000" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="40 960"/>
  </g>
  <path class="glow" d="M520 630A200 34 0 0 1 120 630" fill="none" stroke="#f3e8ff" stroke-width="3"/>

  <!-- Code: a glass cube. -->
  <g class="float">
    <ellipse cx="95" cy="186" rx="30" ry="7" fill="#000" opacity=".35"/>
    <path d="M95 85l35 20-35 20-35-20z" fill="url(#hf-top)"/>
    <path d="M60 105l35 20v40l-35-20z" fill="url(#hf-left)"/>
    <path d="M95 125l35-20v40l-35 20z" fill="url(#hf-right)"/>
    <path d="M95 85l35 20-35 20-35-20zM95 125v40" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.2" stroke-linejoin="round"/>
    <g transform="matrix(.875 .5 0 1 60 105)" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 13l-6 7 6 7M26 13l6 7-6 7M22 9l-4 22"/>
    </g>
    <g transform="matrix(.875 -.5 0 1 95 125)" fill="#c084fc">
      <rect x="7" y="11" width="24" height="3" rx="1.5" opacity=".9"/>
      <rect x="7" y="19" width="15" height="3" rx="1.5" opacity=".6"/>
      <rect x="7" y="27" width="20" height="3" rx="1.5" opacity=".6"/>
    </g>
  </g>

  <!-- The model: a sphere with a ring of its own. -->
  <g class="float d1">
    <ellipse cx="52" cy="372" rx="22" ry="5" fill="#000" opacity=".35"/>
    <g transform="rotate(-18 52 318)">
      <path d="M8 318A44 10 0 0 1 96 318" fill="none" stroke="#e9d5ff" stroke-width="1.5" opacity=".45"/>
    </g>
    <circle class="glow" cx="52" cy="318" r="30" fill="url(#hf-sphere)"/>
    <ellipse cx="42" cy="304" rx="10" ry="6" fill="#fff" opacity=".5" transform="rotate(-30 42 304)"/>
    <use href="#hf-star" transform="translate(54 321) scale(.62)" fill="#fff"/>
    <g transform="rotate(-18 52 318)">
      <path d="M8 318A44 10 0 0 0 96 318" fill="none" stroke="#f3e8ff" stroke-width="2"/>
    </g>
  </g>

  <!-- The check: a shield with depth. -->
  <g transform="translate(585 330)"><g class="float d2">
    <path transform="translate(7 6)" d="M0-34l28 10V2c0 18-13 30-28 36-15-6-28-18-28-36v-26z" fill="#2e1065"/>
    <path class="glow" d="M0-34l28 10V2c0 18-13 30-28 36-15-6-28-18-28-36v-26z" fill="url(#hf-shield)" stroke="#f3e8ff" stroke-opacity=".6" stroke-width="1.5"/>
    <path d="M0-30v64c-13-6-24-17-24-32v-22z" fill="#fff" opacity=".12"/>
    <circle cx="0" cy="2" r="13" fill="#22c55e"/>
    <path d="M-6 2l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g></g>

  <!-- The answer: a chat bubble with depth. -->
  <g class="float d2">
    <path transform="translate(6 6)" d="M40 574h92a16 16 0 0 1 16 16v22a16 16 0 0 1-16 16H66l-24 14 4-14h-6a16 16 0 0 1-16-16v-22a16 16 0 0 1 16-16z" fill="#0b0714"/>
    <path d="M40 574h92a16 16 0 0 1 16 16v22a16 16 0 0 1-16 16H66l-24 14 4-14h-6a16 16 0 0 1-16-16v-22a16 16 0 0 1 16-16z" fill="url(#hf-bubble)" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="48" cy="601" r="10" fill="url(#hf-sphere)"/>
    <use href="#hf-star" transform="translate(48 601) scale(.32)" fill="#fff"/>
    <rect x="66" y="590" width="66" height="5" rx="2.5" fill="#f7f5fa" opacity=".8"/>
    <rect x="66" y="599" width="50" height="5" rx="2.5" fill="#aaa2b8" opacity=".6"/>
    <rect x="66" y="608" width="58" height="5" rx="2.5" fill="#aaa2b8" opacity=".6"/>
    <circle cx="146" cy="576" r="9" fill="#22c55e"/>
    <path d="M142 576l2.8 2.8 5-5.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- What it brings in: an isometric chart. -->
  <g class="float d1">
    <path d="M480 600l60 30v8l-60-30z" fill="#120c1c"/>
    <path d="M540 630l60-30v8l-60 30z" fill="#0b0714"/>
    <path d="M540 570l60 30-60 30-60-30z" fill="#221a2e" stroke="#3a2f50" stroke-width="1.2"/>
    <path d="M510 556l12 6-12 6-12-6z" fill="#d8b4fe"/>
    <path d="M498 562l12 6v26l-12-6z" fill="url(#hf-left)"/>
    <path d="M510 568l12-6v26l-12 6z" fill="url(#hf-right)"/>
    <path d="M540 548l12 6-12 6-12-6z" fill="#d8b4fe"/>
    <path d="M528 554l12 6v46l-12-6z" fill="url(#hf-left)"/>
    <path d="M540 560l12-6v46l-12 6z" fill="url(#hf-right)"/>
    <path d="M570 532l12 6-12 6-12-6z" fill="#fde68a"/>
    <path d="M558 538l12 6v72l-12-6z" fill="url(#hf-gold-l)"/>
    <path d="M570 544l12-6v72l-12 6z" fill="url(#hf-gold-r)"/>
    <path d="M496 538l30-18 24 4 38-30M579 492l9 2-2 9" fill="none" stroke="#e3a53c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bits in the air. -->
  <g class="float d1">
    <path d="M612 195l9 5-9 5-9-5z" fill="#f3e8ff"/>
    <path d="M603 200l9 5v10l-9-5z" fill="#9333ea"/>
    <path d="M612 205l9-5v10l-9 5z" fill="#4c1d95"/>
  </g>
  <use class="pulse" href="#hf-star" transform="translate(240 44) scale(.3)" fill="#e9d5ff"/>
  <use class="pulse slow" href="#hf-star" transform="translate(628 452) scale(.26)" fill="#e3a53c"/>
  <use class="pulse slow d1" href="#hf-star" transform="translate(18 470) scale(.24)" fill="#c084fc"/>
</svg>
